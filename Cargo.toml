[package]
name = "skilldeck"
version = "0.1.3"
edition = "2021"
license = "MIT"
description = "Cross-platform CLI for installing agent skills from Git-backed catalogs"
repository = "https://github.com/Cause-of-a-Kind/skilldeck"
homepage = "https://github.com/Cause-of-a-Kind/skilldeck"
documentation = "https://github.com/Cause-of-a-Kind/skilldeck#readme"
readme = "README.md"
keywords = ["cli", "skills", "agents", "catalog", "git"]
categories = ["command-line-utilities", "development-tools"]
publish = false

[[bin]]
name = "skilldeck"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
directories = "5"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = "1"
sha2 = "0.10"
self-replace = "1"
tar = "0.4"
xz2 = "0.1"
zip = { version = "2", default-features = false, features = ["deflate"] }
strsim = "0.11"
tempfile = "3"
thiserror = "1"
toml = "0.8"
walkdir = "2"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"

[package.metadata.dist]
dist = true
